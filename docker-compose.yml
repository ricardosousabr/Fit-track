services:
  postgres:
    image: postgres:16-alpine
    container_name: fittrack-postgres
    environment:
      POSTGRES_DB: gymflow
      POSTGRES_USER: gymflow
      POSTGRES_PASSWORD: gymflow123
    ports:
      - "5432:5432"
    volumes:
      - fittrack_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fittrack-redis
    ports:
      - "6379:6379"

volumes:
  fittrack_pgdata:
